    <!-- Critical Inline Styles for Branded Loader (First-load only) -->
    <style id="branded-loader-css">
      #branded-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #0B0B14;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s;
        pointer-events: all;
      }
      #branded-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-star-svg {
        width: 100px;
        height: 100px;
        overflow: visible;
      }
      .loader-facet {
        opacity: 0;
        transform-origin: 50px 50px;
        transform: scale(0.6);
        animation: facetStagger 0.32s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
      }
      @keyframes facetStagger {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .lf-1 { animation-delay: 0.04s; }
      .lf-2 { animation-delay: 0.11s; }
      .lf-3 { animation-delay: 0.18s; }
      .lf-4 { animation-delay: 0.25s; }
      .lf-5 { animation-delay: 0.32s; }
      .lf-6 { animation-delay: 0.39s; }
      .lf-7 { animation-delay: 0.46s; }
      .lf-8 { animation-delay: 0.53s; }
      .lf-9 { animation-delay: 0.60s; }
      .lf-10 { animation-delay: 0.67s; }

      @media (prefers-reduced-motion: reduce) {
        #branded-loader {
          display: none !important;
        }
        .loader-facet {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
    <noscript>
      <style>
        #branded-loader { display: none !important; }
      </style>
    </noscript>
  </head>
  <body class="bg-[#0B0B14] text-white font-sans antialiased selection:bg-[#7C3AED] selection:text-white overflow-x-hidden min-h-screen">
    <!-- Branded First-Load Overlay -->
    <div id="branded-loader" aria-hidden="true">
      <svg class="loader-star-svg" viewBox="0 0 100 100" fill="none">
        <path class="loader-facet lf-1" d="M 50,50 L 39.42,35.44 L 50,6 Z" fill="#DDD6FE" />
        <path class="loader-facet lf-2" d="M 50,50 L 50,6 L 60.58,35.44 Z" fill="#8B5CF6" />
        <path class="loader-facet lf-3" d="M 50,50 L 60.58,35.44 L 91.85,36.4 Z" fill="#7C3AED" />
        <path class="loader-facet lf-4" d="M 50,50 L 91.85,36.4 L 67.12,55.56 Z" fill="#581C87" />
        <path class="loader-facet lf-5" d="M 50,50 L 67.12,55.56 L 75.86,85.6 Z" fill="#4C1D95" />
        <path class="loader-facet lf-6" d="M 50,50 L 75.86,85.6 L 50,68 Z" fill="#3B0764" />
        <path class="loader-facet lf-7" d="M 50,50 L 50,68 L 24.14,85.6 Z" fill="#581C87" />
        <path class="loader-facet lf-8" d="M 50,50 L 24.14,85.6 L 32.88,55.56 Z" fill="#7C3AED" />
        <path class="loader-facet lf-9" d="M 50,50 L 32.88,55.56 L 8.15,36.4 Z" fill="#8B5CF6" />
        <path class="loader-facet lf-10" d="M 50,50 L 8.15,36.4 L 39.42,35.44 Z" fill="#C4B5FD" />
      </svg>
    </div>
    <script>
      (function() {
        var loader = document.getElementById('branded-loader');
        if (!loader) return;
        var hasLoaded = false;
        try {
          hasLoaded = sessionStorage.getItem('levelup_session_active') === 'true';
        } catch(e) {}
        if (hasLoaded) {
          loader.style.display = 'none';
          if (loader.parentNode) loader.parentNode.removeChild(loader);
          return;
        }
        try {
          sessionStorage.setItem('levelup_session_active', 'true');
        } catch(e) {}
        var start = Date.now();
        var minTime = 600;
        var maxTime = 1500;
        var finished = false;
        function hide() {
          if (finished) return;
          finished = true;
          var elapsed = Date.now() - start;
          var delay = Math.max(0, minTime - elapsed);
          setTimeout(function() {
            loader.classList.add('loader-hidden');
            setTimeout(function() {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 360);
          }, delay);
        }
        if (document.readyState === 'complete') {
          hide();
        } else {
          window.addEventListener('load', hide, { once: true });
          setTimeout(hide, maxTime);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
