    <!-- Critical Inline Styles for Branded Loader (First-load only) -->
    <style id="branded-loader-css">
      #branded-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #0B0B14;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s;
        pointer-events: all;
      }
      #branded-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-star-svg {
        width: 100px;
        height: 100px;
        overflow: visible;
      }
      .loader-facet {
        opacity: 0;
        transform-origin: 50px 50px;
        transform: scale(0.6);
        animation: facetStagger 0.32s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
      }
      @keyframes facetStagger {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .lf-1 { animation-delay: 0.04s; }
      .lf-2 { animation-delay: 0.11s; }
      .lf-3 { animation-delay: 0.18s; }
      .lf-4 { animation-delay: 0.25s; }
      .lf-5 { animation-delay: 0.32s; }
      .lf-6 { animation-delay: 0.39s; }
      .lf-7 { animation-delay: 0.46s; }
      .lf-8 { animation-delay: 0.53s; }
      .lf-9 { animation-delay: 0.60s; }
      .lf-10 { animation-delay: 0.67s; }

      @media (prefers-reduced-motion: reduce) {
        #branded-loader {
          display: none !important;
        }
        .loader-facet {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>

        <path class="loader-facet lf-9" d="M 50,50 L 32.88,55.56 L 8.15,36.4 Z" fill="#8B5CF6" />

    <script>
      (function() {
        var loader = document.getElementById('branded-loader');
        if (!loader) return;
        var hasLoaded = false;
        try {
          hasLoaded = sessionStorage.getItem('levelup_session_active') === 'true';
        } catch(e) {}
        if (hasLoaded) {
          loader.style.display = 'none';
          if (loader.parentNode) loader.parentNode.removeChild(loader);
          return;
        }
        try {
          sessionStorage.setItem('levelup_session_active', 'true');
        } catch(e) {}
        var finished = false;
        function hide() {
          if (finished) return;
          finished = true;
          loader.classList.add('loader-hidden');
          setTimeout(function() {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 200);
        }
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          hide();
        } else {
          document.addEventListener('DOMContentLoaded', hide, { once: true });
          window.addEventListener('load', hide, { once: true });
          setTimeout(hide, 350);
        }
      })();
    </script>
