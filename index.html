<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
    
    <!-- Title and SEO metadata -->
    <title>LevelUp Ecosystem | Next-Gen AI Web Development & Digital Platform</title>
    <meta name="title" content="LevelUp Ecosystem | Next-Gen AI Web Development & Digital Platform" />
    <meta name="description" content="LevelUp Ecosystem delivers bespoke website engineering, AI-powered web applications, a zero-risk build-before-you-pay workflow, and daily cloud utilities including LevelMovie, LevelMusic, and LevelDay." />
    <meta name="keywords" content="levelup ecosystem, ai web development, custom website agency, zero risk web development, levelmovie, levelmusic, levelday, business website, web application development, cybersecurity" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="LevelUp Ecosystem" />
    <meta name="application-name" content="LevelUp Ecosystem" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- Canonical & Alternate Links -->
    <link rel="canonical" href="https://levelup-ecosystem.com/" />
    <link rel="alternate" href="https://levelup-ecosystem.com/terms" title="Terms of Service" />
    <link rel="alternate" href="https://levelup-ecosystem.com/privacy" title="Privacy Policy" />
    <link rel="alternate" hreflang="en" href="https://levelup-ecosystem.com/" />
    <link rel="alternate" hreflang="x-default" href="https://levelup-ecosystem.com/" />

    <!-- Open Graph / Facebook / WhatsApp / Discord / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LevelUp Ecosystem" />
    <meta property="og:url" content="https://levelup-ecosystem.com/" />
    <meta property="og:title" content="LevelUp Ecosystem | Next-Gen AI Web Development & Digital Platform" />
    <meta property="og:description" content="Build before you pay. LevelUp Ecosystem delivers enterprise-grade websites, custom web applications, AI automation, and high-performance daily cloud services." />
    <meta property="og:image" content="https://levelup-ecosystem.com/icon.svg" />
    <meta property="og:image:secure_url" content="https://levelup-ecosystem.com/icon.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="LevelUp Ecosystem Official Logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@LevelUpEco" />
    <meta name="twitter:creator" content="@LevelUpEco" />
    <meta name="twitter:url" content="https://levelup-ecosystem.com/" />
    <meta name="twitter:title" content="LevelUp Ecosystem | Next-Gen AI Web Development & Digital Platform" />
    <meta name="twitter:description" content="Build before you pay. LevelUp Ecosystem delivers enterprise-grade websites, custom web applications, AI automation, and high-performance daily cloud services." />
    <meta name="twitter:image" content="https://levelup-ecosystem.com/icon.svg" />
    <meta name="twitter:image:alt" content="LevelUp Ecosystem" />

    <!-- Favicons & App Icons -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Polices typographiques -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Phosphor Icons for professional UI icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Schema.org JSON-LD Structured Data for Google Search & Sitelinks -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://levelup-ecosystem.com/#website",
          "url": "https://levelup-ecosystem.com/",
          "name": "LevelUp Ecosystem",
          "alternateName": ["LevelUp", "LevelUp Agency", "LevelUp Eco"],
          "description": "Next-generation AI-powered technology platform providing bespoke web development, zero-risk project validation, and daily cloud apps.",
          "inLanguage": "en-US",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://levelup-ecosystem.com/?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://levelup-ecosystem.com/#organization",
          "name": "LevelUp Ecosystem",

          "email": "contact@levelupecosystem.com",
          "description": "Full-stack software engineering, AI-driven digital platforms, and daily high-performance cloud applications.",
          "sameAs": [
            "https://twitter.com/LevelUpEco",
            "https://levelup-ecosystem.com/terms",
            "https://levelup-ecosystem.com/privacy"
          ]
        },
        {
          "@type": "SiteNavigationElement",

            "Business Pro ($800)",
            "Event Invitations ($120)"

          "url": [
            "https://levelup-ecosystem.com/#levelmovie",
            "https://levelup-ecosystem.com/#contact",
            "https://levelup-ecosystem.com/#pricing",
            "https://levelup-ecosystem.com/#music",
            "https://levelup-ecosystem.com/#weather",
            "https://levelup-ecosystem.com/#process",
            "https://levelup-ecosystem.com/#security",
            "https://levelup-ecosystem.com/#pricing-starter",
            "https://levelup-ecosystem.com/#pricing-pro",
            "https://levelup-ecosystem.com/#pricing-event"
          ]
        },
        {
          "@type": "OfferCatalog",
          "@id": "https://levelup-ecosystem.com/#pricing-catalog",
          "name": "LevelUp Web & App Development Pricing",
          "itemListElement": [
            {
              "@type": "Offer",
              "name": "Virtual Invitation & Event Website",
              "price": "120",
              "priceCurrency": "USD",
              "description": "Interactive virtual event invitation with custom bespoke design and built-in RSVP tracking."

            {
              "@type": "Offer",
              "name": "Starter Website Package",
              "price": "350",

            {

              "name": "Business Pro Website",
              "price": "800",

              "description": "Full-featured multi-page commercial platform with custom branding, advanced SEO, and speed optimization."

            {
              "@type": "Offer",
              "name": "Custom Ecosystem Application",
              "price": "Custom",
              "priceCurrency": "USD",
              "description": "Enterprise-grade bespoke SaaS, AI integration, real-time databases, and interactive tools."
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased selection:bg-[#7c3aed] selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
