<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <!-- Faceted Storefront / Local Building -->
    <!-- Roof Peak & Left Awning Facet (Top-Left Light: #DDD6FE, #A78BFA) -->
