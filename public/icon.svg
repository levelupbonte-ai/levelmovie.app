<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="lvl_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b29"/>
      <stop offset="50%" stop-color="#0a0514"/>
      <stop offset="100%" stop-color="#030008"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bg_grad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="rgba(168,85,247,0.3)" stroke-width="4" fill="none" />

  <!-- Neon Glow effect behind logo -->
  <g filter="url(#glow)" opacity="0.8">
    <path d="M140 100 V340 C140 375.3 168.7 404 204 404 H370" stroke="url(#lvl_grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M228 175 C228 156.4 248.5 145 264.4 154.7 L370 219.7 C385.4 229.2 385.4 251.8 370 261.3 L264.4 326.3 C248.5 336 228 324.6 228 306 V175 Z" fill="url(#lvl_grad)" />
  </g>

  <!-- Main Crisp Vector Paths -->
  <path d="M140 100 V340 C140 375.3 168.7 404 204 404 H370" stroke="url(#lvl_grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M228 175 C228 156.4 248.5 145 264.4 154.7 L370 219.7 C385.4 229.2 385.4 251.8 370 261.3 L264.4 326.3 C248.5 336 228 324.6 228 306 V175 Z" fill="url(#lvl_grad)" />
</svg>
