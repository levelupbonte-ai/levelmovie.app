    <!-- Critical Inline Styles for Branded Loader (First-load only) -->
    <style id="branded-loader-css">
      #branded-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #0B0B14;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s;
        pointer-events: all;
      }
      #branded-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-star-svg {
        width: 100px;
        height: 100px;
        overflow: visible;
      }
      .loader-facet {
        opacity: 0;
        transform-origin: 50px 50px;
        transform: scale(0.6);
        animation: facetStagger 0.32s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
      }
      @keyframes facetStagger {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .facet-1 { animation-delay: 0.03s; fill: #4C1D95; }
      .facet-2 { animation-delay: 0.08s; fill: #5B21B6; }
      .facet-3 { animation-delay: 0.13s; fill: #6D28D9; }
      .facet-4 { animation-delay: 0.18s; fill: #7C3AED; }
      .facet-5 { animation-delay: 0.23s; fill: #8B5CF6; }
      .facet-6 { animation-delay: 0.28s; fill: #A78BFA; }
      .facet-7 { animation-delay: 0.33s; fill: #C4B5FD; }
      .facet-8 { animation-delay: 0.38s; fill: #EDE9FE; }
    </style>
  </head>
  <body class="bg-[#0B0B14] text-[#A1A1B5] antialiased selection:bg-[#7C3AED] selection:text-white">
    <div id="branded-loader" aria-hidden="true">
      <svg class="loader-star-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="loader-facet facet-1" d="M50 8L50 50L60 30Z" />
        <path class="loader-facet facet-2" d="M50 8L50 50L40 30Z" />
        <path class="loader-facet facet-3" d="M92 50L50 50L70 40Z" />
        <path class="loader-facet facet-4" d="M92 50L50 50L70 60Z" />
        <path class="loader-facet facet-5" d="M50 92L50 50L40 70Z" />
        <path class="loader-facet facet-6" d="M50 92L50 50L60 70Z" />
        <path class="loader-facet facet-7" d="M8 50L50 50L30 60Z" />
        <path class="loader-facet facet-8" d="M8 50L50 50L30 40Z" />
      </svg>
    </div>
    <script>
      (function() {
        var loader = document.getElementById('branded-loader');
        if (!loader) return;
        var hasLoaded = false;
        try {
          hasLoaded = sessionStorage.getItem('levelup_session_active') === 'true';
        } catch(e) {}
        if (hasLoaded) {
          loader.style.display = 'none';
          if (loader.parentNode) loader.parentNode.removeChild(loader);
          return;
        }
        try {
          sessionStorage.setItem('levelup_session_active', 'true');
        } catch(e) {}
        var start = Date.now();
        var minTime = 600;
        var maxTime = 1500;
        var finished = false;
        function hide() {
          if (finished) return;
          finished = true;
          var elapsed = Date.now() - start;
          var delay = Math.max(0, minTime - elapsed);
          setTimeout(function() {
            loader.classList.add('loader-hidden');
            setTimeout(function() {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 360);
          }, delay);
        }
        if (document.readyState === 'complete') {
          hide();
        } else {
          window.addEventListener('load', hide, { once: true });
          setTimeout(hide, maxTime);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/entries/security.tsx"></script>
  </body>
